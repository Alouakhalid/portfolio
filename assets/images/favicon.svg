<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8a2be2"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.8" filter="url(#glow)"/>

  <!-- Neural Synapse Connections -->
  <path d="M12 32 L24 18 L40 18 L52 32 L40 46 L24 46 Z" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="3,3"/>
  <path d="M24 18 L40 46 M40 18 L24 46 M12 32 L52 32" fill="none" stroke="#8a2be2" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Neural Nodes -->
  <circle cx="24" cy="18" r="2.5" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="40" cy="18" r="2.5" fill="#8a2be2" filter="url(#glow)"/>
  <circle cx="12" cy="32" r="2.5" fill="#10b981" filter="url(#glow)"/>
  <circle cx="52" cy="32" r="2.5" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="24" cy="46" r="2.5" fill="#8a2be2" filter="url(#glow)"/>
  <circle cx="40" cy="46" r="2.5" fill="#00f2fe" filter="url(#glow)"/>

  <!-- Stylized AK (Ali Khalid) Monogram Core -->
  <text x="32" y="38" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="20" font-weight="900" fill="url(#neonGrad)" text-anchor="middle" letter-spacing="1" filter="url(#glow)">AK</text>
  
  <!-- Central Quantum Pulse Core -->
  <circle cx="32" cy="14" r="1.5" fill="#00f2fe"/>
</svg>
